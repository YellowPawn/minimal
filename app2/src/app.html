<!doctype html>
<html lang="en" class="h-full bg-white scheme-light">
  <head>
    <meta charset="utf-8" />
    <title>Minimal App 2</title>
    <meta name="author" content="Brian McBarron" />
    <meta name="description" content="Minimal Firebase + SvelteKit SSR app" />
    <link rel="manifest" href="%sveltekit.assets%/app.webmanifest" crossorigin="use-credentials" />
    <!-- Basic favicon -->
    <link rel="icon" href="%sveltekit.assets%/assets/icon-16.png" />
    <!-- Font: Material Symbols Outlined -->
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0,0" />
    <!-- Font: Roboto -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,600,700" />
    <!-- Font: Roboto Mono -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto+Mono" />
    <!-- Font: Inter, recommended by Tailwind -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <!-- Setting maximum-scale prevents zoom in on inputs when entering data. Which is confusing,
         but required for accessibility.
         See:
           https://stackoverflow.com/a/46254706/8107589
           https://developer.mozilla.org/en-US/docs/Web/HTML/Viewport_meta_tag#maximum-scale
    -->
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <script src="https://accounts.google.com/gsi/client" async></script> -->
    %sveltekit.head%
  </head>
  <body class="h-full">
    %sveltekit.body%
  </body>
</html>
