<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>%sveltekit.error.message%</title>
    <style>
      html {
        color: oklch(0.97807 0.029 256.847);
        background-color: oklch(0.2533 0.016 252.42);
        width: 100%;
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        align-items: center;
        text-align: center;
        padding: 1rem;
        margin-top: 25%;
        font-family: sans-serif;
        font-size: 1.125rem;
        line-height: 1.5;
      }

      .header {
        color: #ef4b81;
        font-size: 2.25rem;
        line-height: 1.11;
        font-family: Meatball, Verdana, sans-serif;
        font-weight: 700;
        margin: 0;
      }
      .header.subheader {
        margin-top: 0.5rem;
        font-size: 1.5rem;
      }
      .data {
        text-align: left;
        border-spacing: 0.5rem 0rem;
        font-size: 1rem;

        td {
          vertical-align: top;
          font-weight: 700;
        }

        td:nth-child(1) {
          text-align: right;
          font-style: italic;
          font-weight: inherit;
        }        
      }
      .emphasis {
          font-style: italic;
      }
      a {
        color: oklch(74% 0.16 232.661);
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div>
      <h1 class="header">Oh no!</h1>
      <h2 class="header subheader">Something <span class="emphasis">really</span> unexpected error occurred.</h2>
    </div>
    <div>
      Please contact us at<br />
      <a href="mailto:brian@mcbarron.net">brian@mcbarron.net</a><br />
      and provide the following information.
    </div>
    <table class="data">
      <tr>
        <td>Message:</td>
        <td>%sveltekit.error.message%</td>
      </tr>
      <tr>
        <td>Code:</td>
        <td>%sveltekit.status%</td>
      </tr>
    </div>
  </body>
</html>
